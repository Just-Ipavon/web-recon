name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for required in ("webrecon/data/subdomains-small.txt", "webrecon/cli.py",
                           "webrecon/py.typed"):
              assert required in names, f"{required} missing from wheel"
          assert any(n.endswith("entry_points.txt") for n in names)
          PY

      - name: Smoke-test the installed entry point
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/webrecon --version
          /tmp/wheel-venv/bin/webrecon --help > /dev/null
          /tmp/wheel-venv/bin/python -c "from webrecon.config import bundled_wordlist; from webrecon.modules.dns_enum import load_wordlist; assert 'www' in load_wordlist(bundled_wordlist())"

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

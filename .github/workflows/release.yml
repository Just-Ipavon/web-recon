name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.2.1 (must match webrecon.__version__)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]] || { echo "invalid tag $TAG"; exit 1; }
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('webrecon/__init__.py').read()).group(1))")
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          pip install -e ".[dev]"
          ruff check .
          mypy
          pytest -q

      - name: Build wheel and sdist
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Extract release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG entry for $VERSION"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        # A tag push already created the tag; a manual run creates it on this commit.
        run: |
          gh release create "$TAG" dist/* --title "webrecon $VERSION" --notes-file notes.md \
            --target "$GITHUB_SHA"

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI accepts uploads from this workflow and environment
    # only, so no API token is stored in the repository.
    environment:
      name: pypi
      url: https://pypi.org/project/webrecon-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

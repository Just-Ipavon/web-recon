name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.2.0 (must match webrecon.__version__)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]] || { echo "invalid tag $TAG"; exit 1; }
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('webrecon/__init__.py').read()).group(1))")
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: |
          pip install -e ".[dev]"
          ruff check .
          mypy
          pytest -q

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Extract release notes from the changelog
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG entry for $VERSION"; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag push already created the tag; a manual run creates it on this commit.
        run: |
          gh release create "$TAG" dist/* --title "webrecon $VERSION" --notes-file notes.md \
            --target "$GITHUB_SHA"

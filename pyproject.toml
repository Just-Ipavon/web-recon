[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webrecon-cli"
dynamic = ["version"]
description = "A small web reconnaissance scanner: DNS, subdomains, HTTP fingerprinting, TLS and ports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "rich>=13.7",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/Just-Ipavon/web-recon"
Documentation = "https://github.com/Just-Ipavon/web-recon/tree/main/docs"
Issues = "https://github.com/Just-Ipavon/web-recon/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
webrecon = "webrecon.cli:main"

[tool.setuptools.dynamic]
version = { attr = "webrecon.__version__" }

[tool.setuptools.packages.find]
include = ["webrecon*"]

[tool.setuptools.package-data]
webrecon = ["data/*.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["webrecon"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["dns.*"]
ignore_missing_imports = true
